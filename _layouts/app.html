<html>

    {% include head.html %}

    <body id="applic">

        {% include header.html %}

        <section id="banner" class="style2">
            <div class="inner">
                <span class="image">
                    <img src="{{ site.baseurl }}/{{ page.image }}" alt="">
                </span>
                <header class="major">

                    <h2>{{ page.title }}</h2>

                </header>
                <div class="content">

                    {{ page.description }}

                </div>
            </div>
        </section>


      <!-- Main -->
      <div id="main" class="alt">

      <!-- One -->
      <section id="one">
	      <div class="inner">
	
		    {{ content }}
	    </div>
    </section>

      </div>

    {% include footer.html %}


</body>

</html>


<style>

/* -------------------------
   GLOBAL STYLING
--------------------------*/

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  line-height: 1.6;
  color: #333;
}

.box {
  padding: 40px;
  margin-bottom: 60px;
  border-radius: 14px;
  background: #ffffff;
  box-shadow: 0 4px 18px rgba(0,0,0,0.05);
}

h1, h2 {
  margin-bottom: 20px;
  font-weight: 600;
}

h3 {
  margin-bottom: 15px;
  font-weight: 500;
}

p {
  color: #444;
}

/* -------------------------
   HERO SECTION
--------------------------*/

.hero {
  padding: 80px 40px;
  border-radius: 16px;
  background: linear-gradient(135deg, #f4f7fb 0%, #eaf1f8 100%);
  margin-bottom: 60px;
  text-align: center;
}

.hero h1 {
  font-size: 2.5rem;
  margin-bottom: 10px;
}

.hero .subtitle {
  font-size: 1.2rem;
  color: #555;
  margin-bottom: 40px;
}

.hero-stats {
  display: flex;
  justify-content: center;
  gap: 60px;
  flex-wrap: wrap;
}

.hero-stats div {
  font-size: 0.95rem;
}

.hero-stats strong {
  font-size: 1.6rem;
  display: block;
}

/* -------------------------
   SECTION NAV
--------------------------*/

.section-nav {
  border-radius: 14px;
  display: flex;
  justify-content: center;
  gap: 30px;
  margin-bottom: 50px;
  padding-bottom: 15px;
  border-bottom: 1px solid #eee;
}

.section-nav a {
  text-decoration: none;
  color: #555;
  font-weight: 500;
}

.section-nav a:hover {
  color: #007acc;
}

/* -------------------------
   CARDS
--------------------------*/

.card {
  padding: 25px;
  border-radius: 10px;
  background: #f8f8f8;
  box-shadow: 0 2px 8px rgba(0,0,0,0.04);
  margin-bottom: 20px;
}

/* -------------------------
   TABLES
--------------------------*/

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.95rem;
}

th {
  background-color: #f2f5f8;
  font-weight: 600;
}

td, th {
  padding: 10px 14px;
  border-bottom: 1px solid #eee;
}

tbody tr:hover {
  background-color: #fafafa;
}


/* -------------------------
   CTA SECTION
--------------------------*/

.cta {
  padding: 60px;
  text-align: center;
  border-radius: 16px;
  background: #f4f7fb;
  margin-top: 60px;
}

.cta h2 {
  margin-bottom: 15px;
}

.cta p {
  margin-bottom: 25px;
  color: #555;
}

/* -------------------------
   IMAGES
--------------------------*/

img {
  border-radius: 2px;
}


.section-nav {
  position: sticky;
  top: 0;
  background: white;
  padding: 15px 0;
  z-index: 100;
}

.section-nav a {
  margin: 0 15px;
  text-decoration: none;
  color: #555;
  font-weight: 500;
}

.section-nav a.active {
  color: #007acc;
  border-bottom: 2px solid #007acc;
}

/* -------------------------
   COLLAPSIBLE SECTIONS
--------------------------*/

.collapsible-section {
  margin-bottom: 40px;
}

.section-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  cursor: pointer;
}

.section-header h2 {
  margin: 0;
}

.section-content {
  overflow: hidden;
  transition: max-height 0.35s ease, opacity 0.25s ease;
}

.section-content.collapsed {
  max-height: 0;
  opacity: 0;
  padding-top: 0;
  margin-top: 0;
}


</style>





<script>
/* Automatically convert certain sections to cards */

document.addEventListener("DOMContentLoaded", function() {

  // Convert small inner boxes to cards
  document.querySelectorAll(".box .box").forEach(function(el){
    el.classList.remove("box");
    el.classList.add("card");
  });
  
});


// Collapsible sections
document.querySelectorAll(".collapsible-section").forEach(function(section){

  const header = section.querySelector(".section-header");
  const content = section.querySelector(".section-content");

  // Set initial max height
  content.style.maxHeight = content.scrollHeight + "px";

  header.addEventListener("click", function(){

    if(content.classList.contains("collapsed")){
      content.classList.remove("collapsed");
      content.style.maxHeight = content.scrollHeight + "px";
    } else {
      content.classList.add("collapsed");
      content.style.maxHeight = "0";
    }

  });

});
</script>
